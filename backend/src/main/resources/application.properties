server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:system}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.admin.email=${ADMIN_EMAIL:siva@gmail.com}
app.admin.password=${ADMIN_PASSWORD:siva123}

server.servlet.session.cookie.same-site=${SESSION_SAMESITE:Lax}
server.servlet.session.cookie.secure=${SESSION_SECURE:false}
server.forward-headers-strategy=framework
