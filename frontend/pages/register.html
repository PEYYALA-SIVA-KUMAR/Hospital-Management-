<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Registration | Medilane Hospital</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-badge">M</div>
        Medilane Hospital
      </div>
      <nav class="nav-links">
        <!-- <a href="../index.html">Home</a> -->
        <a href="login.html">Login</a>
        <a class="active" href="register.html">Register</a>
        <!-- <a href="../index.html#services">Services</a>
        <a href="../index.html#contact">Contact</a> -->
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="form-wrap">
      <div class="badge">Patient Registration</div>
      <h1 class="form-title">Create your account</h1>
      <p class="helper">Please fill in accurate details so our doctors can assist you better.</p>

      <div class="flash" style="margin: 12px 0;"></div>
      <ul id="formErrors" class="helper" style="color:#c0392b; padding-left:18px;"></ul>

      <form id="registerForm">
        <div class="form-row">
          <label for="fullName">Full Name</label>
          <input id="fullName" type="text" placeholder="Enter full name" required />
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Minimum 6 characters" required />
        </div>
        <div class="form-row">
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" placeholder="10 digit number" required />
        </div>
        <div class="form-row">
          <label for="age">Age</label>
          <input id="age" type="number" placeholder="Age" min="1" required />
        </div>
        <div class="form-row">
          <label for="gender">Gender</label>
          <select id="gender" required>
            <option value="">Select gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
        <p class="helper" style="margin-top:12px;">Already registered? <a href="login.html" style="color:var(--primary);">Login here</a></p>
      </form>
    </div>
  </main>

  <footer class="footer">Your data stays secure with hospital-grade privacy.</footer>
  <script src="../assets/js/app.js"></script>
</body>
</html>
