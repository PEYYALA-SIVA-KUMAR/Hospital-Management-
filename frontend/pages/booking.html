<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment | Medilane Hospital</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-badge">M</div>
        Medilane Hospital
      </div>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="booking.html">Book</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="form-wrap">
      <div class="badge">Appointment Booking</div>
      <h1 class="form-title">Reserve your consultation</h1>
      <p class="helper">Choose a doctor, share symptoms, and pick a convenient date.</p>

      <ul id="bookingErrors" class="helper" style="color:#c0392b; padding-left:18px;"></ul>

      <form id="bookingForm">
        <div class="form-row">
          <label for="patientName">Patient Name</label>
          <input id="patientName" type="text" placeholder="Your name" required />
        </div>
        <div class="form-row">
          <label for="patientAge">Age</label>
          <input id="patientAge" type="number" min="1" placeholder="Age" required />
        </div>
        <div class="form-row">
          <label for="patientPhone">Phone Number</label>
          <input id="patientPhone" type="tel" placeholder="10 digit number" required />
        </div>
        <div class="form-row">
          <label for="doctor">Select Doctor</label>
          <select id="doctor" required>
            <option value="">Choose service</option>
            <option>Full Body Checkup</option>
            <option>General Physician</option>
            <option>Heart Specialist</option>
            <option>Orthopedic Doctor</option>
            <option>Skin Specialist</option>
            <option>Eye Specialist</option>
          </select>
        </div>
        <div class="form-row">
          <label for="problem">Health Problem Description</label>
          <textarea id="problem" rows="3" placeholder="Describe your symptoms" required></textarea>
        </div>
        <div class="form-row">
          <label for="date">Appointment Date</label>
          <input id="date" type="date" required />
        </div>
        <button class="btn btn-primary" type="submit">Proceed to Payment</button>
      </form>
    </div>
  </main>

  <footer class="footer">We will confirm your appointment once payment is completed.</footer>
  <script src="../assets/js/app.js"></script>
</body>
</html>
