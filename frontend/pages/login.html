<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Medilane Hospital</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-badge">M</div>
        Medilane Hospital
      </div>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a class="active" href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="grid" style="align-items:center;">
      <div class="hero-card">
        <h1 class="form-title">Welcome back</h1>
        <p class="helper">One login page for patients and admins.</p>
        <img src="../assets/img/doctor-general.svg" alt="Doctor" style="margin-top:16px;" />
      </div>

      <div class="form-wrap">
        <div class="badge">Login</div>
        <div class="flash" style="margin: 12px 0;"></div>
        <form id="loginForm">
          <div class="form-row">
            <label for="loginRole">Role</label>
            <select id="loginRole" required>
              <option value="patient">Patient</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-row">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" placeholder="you@example.com" required />
          </div>
          <div class="form-row">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="Password" required />
          </div>
          <button class="btn btn-primary" type="submit">Login</button>
          <p class="helper" style="margin-top:12px;">New patient? <a href="register.html" style="color:var(--primary);">Register now</a></p>
          <p class="helper" style="margin-top:6px;">Admin demo: admin@medilane.com / admin123</p>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">Need help? Contact our 24/7 support.</footer>
  <script src="../assets/js/app.js"></script>
</body>
</html>
