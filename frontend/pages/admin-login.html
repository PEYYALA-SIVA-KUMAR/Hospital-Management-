<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Medilane Hospital</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body data-page="admin-login">
  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-badge">M</div>
        Medilane Hospital
      </div>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="login.html">Patient Login</a>
        <a class="active" href="admin-login.html">Admin Login</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="form-wrap">
      <div class="badge">Admin Access</div>
      <h1 class="form-title">Admin Login</h1>
      <p class="helper">Use your admin credentials to manage patients and appointments.</p>

      <div class="flash" style="margin: 12px 0;"></div>
      <form id="adminLoginForm">
        <div class="form-row">
          <label for="adminEmail">Email</label>
          <input id="adminEmail" type="email" placeholder="admin@medilane.com" required />
        </div>
        <div class="form-row">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" type="password" placeholder="Admin password" required />
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
        <p class="helper" style="margin-top:12px;">Demo admin: admin@medilane.com / admin123</p>
      </form>
    </div>
  </main>

  <footer class="footer">Admin actions are logged for security.</footer>
  <script src="../assets/js/app.js"></script>
</body>
</html>
